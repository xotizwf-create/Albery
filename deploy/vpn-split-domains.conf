# Что ходит через VPN-туннель. Всё остальное идёт НАПРЯМУЮ через eth0.
# Production target: /etc/albery/vpn-split-domains.conf
#
# До 16.08.2026 модель была обратной: через туннель шёл ВЕСЬ внешний трафик, и часовой
# простой VPN отрезал бота от Битрикса, Google и Zoom разом — хотя ни один из них в
# туннеле не нуждается (Битрикс напрямую отвечает за 1,15 с). Теперь туннель обслуживает
# только те сервисы, которые напрямую действительно недоступны.
#
# Формат — одна запись в строке:
#   host <домен>       — резолвится каждые несколько минут, все A-записи уходят в туннель
#   net  <CIDR>        — фиксированная подсеть (для сервисов с известными диапазонами)
# Пустые строки и строки с # игнорируются.
#
# ВАЖНО про host: маршрут строится по IP, полученным резолвером. У сервисов за CDN адреса
# меняются, поэтому список пересобирается по таймеру (vpn-split-routes.timer). Не добавляйте
# сюда широкие CDN-диапазоны (например, целые сети Cloudflare) — вместе с нужным сервисом
# в туннель уедет половина интернета.
#
# Правило пополнения: сначала прогнать scripts/vpn_direct_probe.sh. Сервис попадает сюда
# ТОЛЬКО если напрямую он отдаёт 000 (соединение не состоялось). Любой HTTP-код означает,
# что сервис достижим и туннель ему не нужен.

# --- OpenAI: мозг агента (Codex/ChatGPT) -------------------------------------------------
host api.openai.com
host chatgpt.com
host auth.openai.com
host openai.com
host cdn.openai.com

