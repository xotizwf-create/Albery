# Что ходит через VPN-туннель. Всё остальное идёт НАПРЯМУЮ через eth0.
# Production target: /etc/albery/vpn-split-domains.conf
#
# До 16.08.2026 модель была обратной: через туннель шёл ВЕСЬ внешний трафик, и часовой
# простой VPN отрезал бота от Битрикса, Google и Zoom разом — хотя ни один из них в
# туннеле не нуждается (Битрикс напрямую отвечает за 1,15 с). Теперь туннель обслуживает
# только те сервисы, которые напрямую действительно недоступны.
#
# Формат — одна запись в строке:
#   host <домен>       — резолвится каждые несколько минут, все A-записи уходят в туннель
#   net  <CIDR>        — фиксированная подсеть (для сервисов с известными диапазонами)
# Пустые строки и строки с # игнорируются.
#
# ВАЖНО про host: маршрут строится по IP, полученным резолвером. У сервисов за CDN адреса
# меняются, поэтому список пересобирается по таймеру (vpn-split-routes.timer). Не добавляйте
# сюда широкие CDN-диапазоны (например, целые сети Cloudflare) — вместе с нужным сервисом
# в туннель уедет половина интернета.
#
# Правило пополнения: сначала прогнать scripts/vpn_direct_probe.sh и смотреть на его
# ВЕРДИКТ, а не на голый HTTP-код. Сервис попадает сюда, если напрямую он даёт «нет связи»
# (000) ИЛИ «ГЕОБЛОК» — отказ по географии. Достижимость и пригодность — разные вещи:
# 16.08.2026 api.openai.com напрямую отвечал живым 403 с телом
# unsupported_country_region_territory, а api.groq.com — 403 Forbidden. По прежнему правилу
# «любой HTTP-код = туннель не нужен» их следовало отсюда убрать, то есть выключить мозг
# агента и голосовые. Закреплено тестом tests/unit/test_vpn_direct_probe.py.

# --- OpenAI: мозг агента (Codex/ChatGPT) -------------------------------------------------
host api.openai.com
host chatgpt.com
host auth.openai.com
host openai.com
host cdn.openai.com

# --- Telegram: TG-агент @Albery_AI2_Bot и резервный канал тревог --------------------------
# В РФ ограничен, поэтому включён по умолчанию. Диапазоны Telegram публичны и узкие —
# держим их сетями, а не именами: у api.telegram.org адреса меняются чаще, чем идёт
# пересборка списка, и один промах резолвера означает молчащего бота.
host api.telegram.org
net 149.154.160.0/20
net 91.108.4.0/22
net 91.108.8.0/22
net 91.108.12.0/22
net 91.108.16.0/22
net 91.108.56.0/22

# --- Groq: голосовые (Whisper) и фильтры лидов --------------------------------------------
host api.groq.com

# --- Проверять замером ---------------------------------------------------------------------
# scripts/vpn_direct_probe.sh покажет, что из перечисленного работает и НАПРЯМУЮ. Убирать
# отсюда следует только то, у чего вердикт «напрямую»: лишняя запись привязывает рабочий
# сервис к живучести VPN, а именно от этого мы и уходим. Вердикт «ГЕОБЛОК» — НЕ повод
# убирать, это отказ обслуживать, замаскированный под успешный ответ.
# Google, Zoom, Битрикс, GitHub и WB сюда НЕ добавлять — 16.08.2026 замерено, что они
# отвечают напрямую (Битрикс — за 1,15 с, GitHub — 200).
