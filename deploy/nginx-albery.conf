# Основное приложение
server {
    listen 443 ssl;
    server_name www.m4s.ru;

    client_max_body_size 100M;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'" always;

    # MCP is a same-host transport. Return no capability/auth details and do not persist legacy
    # URL credentials if an old link is probed. Public event/webhook routes are unaffected.
    location ~ ^/(?:mcp(?:-|/|$)|sse(?:-|/|$)) {
        access_log off;
        return 404;
    }

    # Вебхуки Битрикса, Zoom и Google Drive идут в РОЛЬ БОТА (5002). Там же живут разговоры
    # ботов и всё состояние в памяти, которое их обслуживает: накопление сообщений одного
    # человека в один ход, реестр живых ходов для кнопки «Новая сессия» и восстановление
    # ходов, прерванных рестартом. Роль бота однопроцессная — поэтому это состояние остаётся
    # верным без переноса в базу. Разделение сделано 07.08.2026 именно ради этого.
    location ~ ^/(bitrix/|zoom/events/|google-drive/events/) {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }

    # Всё остальное — сайт, API, Центр Агента — в РОЛЬ ВЕБ (5003, gunicorn). Зависший ход
    # мозга живёт в другом процессе и больше не задерживает выдачу страниц.
    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }

    ssl_certificate /etc/letsencrypt/live/m4s.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m4s.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# MCP endpoint
server {
    listen 443 ssl;
    server_name mcp.m4s.ru;

    client_max_body_size 100M;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'" always;

    # Only authenticated external integrations below are public. Agent MCP never crosses Nginx.
    location ~ ^/(?:mcp(?:-|/|$)|sse(?:-|/|$)) {
        access_log off;
        return 404;
    }

    # Инструменты агентов — РОЛЬ MCP (5004, gunicorn). Отделена, чтобы зависание в обработке
    # разговора не уносило вместе с собой доступ агентов к данным: раньше это выглядело как
    # «агент не ставит задачи» и модель ретраила до таймаута моста в 600 с.
    location / {
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }

    ssl_certificate /etc/letsencrypt/live/m4s.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m4s.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP именованных хостов → HTTPS
server {
    listen 80;
    server_name m4s.ru www.m4s.ru mcp.m4s.ru;
    return 301 https://$host$request_uri;
}
